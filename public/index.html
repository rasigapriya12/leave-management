<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Leave Management System</h1>
    <p class="subtitle">Register, view your leave balance and apply for leave.</p>

    <section id="login-section" class="panel">
      <h2>Login</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <button class="btn" type="submit">Login</button>
      </form>
      <p>Don't have an account? <button id="show-registration" class="text-btn" type="button">Create user</button></p>
    </section>

    <section id="registration-section" class="panel" hidden>
      <h2>Create User</h2>
      <form id="registration-form">
        <label for="username">Username</label><input type="text" id="username" required>
        <label for="reg-email">Email</label><input type="email" id="reg-email" required>
        <label for="roll-number">Roll Number</label><input type="text" id="roll-number" required>
        <label for="casual-leave">Initial Casual Leave</label><input type="number" id="casual-leave" min="0" value="10" required>
        <label for="medical-leave">Initial Medical Leave</label><input type="number" id="medical-leave" min="0" value="10" required>
        <button class="btn" type="submit">Register</button>
      </form>
      <p>Already registered? <button id="show-login" class="text-btn" type="button">Login</button></p>
      <p id="registration-response" class="message" aria-live="polite"></p>
    </section>

    <section id="balance-section" class="panel" hidden>
      <h2>Leave Balance</h2>
      <p>Welcome, <strong id="username-display"></strong> (Roll Number: <strong id="roll-number-display"></strong>)</p>
      <div class="balances">
        <p>Casual Leave: <strong id="casual-leave-display">0</strong> days</p>
        <p>Medical Leave: <strong id="medical-leave-display">0</strong> days</p>
      </div>
      <div class="button-row">
        <button id="refresh-balance" class="btn secondary" type="button">Refresh Balance</button>
        <button id="logout-button" class="btn danger" type="button">Logout</button>
      </div>
    </section>

    <section id="apply-leave-section" class="panel" hidden>
      <h2>Apply for Leave</h2>
      <form id="leave-form">
        <label for="leave-type">Leave Type</label>
        <select id="leave-type"><option value="casual">Casual</option><option value="medical">Medical</option></select>
        <label for="leave-days">Number of Days</label>
        <input type="number" id="leave-days" min="1" step="1" required>
        <button class="btn" type="submit">Apply Leave</button>
      </form>
    </section>
    <p id="response-message" class="message" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
